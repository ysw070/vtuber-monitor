name: 주간 수집 및 배포

# 매주 월요일 00:00 UTC(= 한국시간 오전 9시) 자동 수집 + 수동 실행 + 데이터 푸시 시 재배포
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: "수집 API 없이 재빌드만(탐지 반영용)"
        required: false
        default: "false"
  # 뉴스·명부·코드가 레포에 올라오면 즉시 재빌드·배포(수집 API·유튜브 API는 호출하지 않음)
  push:
    branches: [main]
    paths:
      - "data/news/**"
      - "data/*.xlsx"
      - "data/manual_groups.csv"
      - "data/agency_members.csv"
      - "data/discovered_chzzk.json"
      - "pipeline/**"
      - "build.py"

# Pages 배포에 필요한 권한 + 스냅샷 커밋 권한
permissions:
  contents: write
  pages: write
  id-token: write

# 동시 실행 방지(중복 수집 차단)
concurrency:
  group: "collect-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 → 스냅샷 → 유튜브통계 → 빌드
        env:
          GH_REPO: ${{ github.repository }}
          # push 재빌드는 개인 운영 수집 API(나의 작은 버튜버)를 부르지 않는다. 유튜브·치지직 공개 API는 호출(할당량 여유 충분)
          SKIP_COLLECT: ${{ (github.event_name == 'push' || inputs.rebuild_only == 'true') && '1' || '' }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python build.py

      - name: 갱신된 데이터 커밋(스냅샷 히스토리 보존)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/ || true
          git commit -m "${{ (github.event_name == 'push' || inputs.rebuild_only == 'true') && '재빌드' || '주간 수집' }}: $(date -u +%Y-%m-%d)" || echo "변경 없음 — 커밋 건너뜀"
          # 탐지 워크플로 커밋과 겹칠 수 있으니 최신을 받아 재시도
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push -q && break; sleep 5; done || echo "푸시 실패"

      - name: Pages 아티팩트 업로드(public/ 디렉터리)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
